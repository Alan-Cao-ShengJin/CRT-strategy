[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crt-futures"
version = "1.0.0"
description = "Transcript-derived CRT research and paper trading for MNQ, MES and MGC"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1", "websockets>=14,<17"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
crt = "crt.cli:main"

[tool.setuptools.packages.find]
include = ["crt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
